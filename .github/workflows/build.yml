name: Build YemenBills APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build unsigned release APK
        run: gradle :app:assembleRelease --stacktrace

      - name: Sign release APK
        env:
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SIGNING_KEY_BASE64" || { echo 'Missing SIGNING_KEY_BASE64 secret'; exit 1; }
          test -n "$SIGNING_STORE_PASSWORD" || { echo 'Missing SIGNING_STORE_PASSWORD secret'; exit 1; }
          KEYSTORE="$RUNNER_TEMP/water-bills-release.jks"
          printf '%s' "$SIGNING_KEY_BASE64" | base64 --decode > "$KEYSTORE"
          chmod 600 "$KEYSTORE"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          UNSIGNED_APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          ALIGNED_APK="$RUNNER_TEMP/app-release-aligned.apk"
          SIGNED_APK="app/build/outputs/apk/release/app-release.apk"
          test -f "$UNSIGNED_APK" || { echo 'Unsigned release APK not found'; exit 1; }
          "$BUILD_TOOLS/zipalign" -f -p 4 "$UNSIGNED_APK" "$ALIGNED_APK"
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$KEYSTORE" \
            --ks-key-alias waterbills \
            --ks-pass env:SIGNING_STORE_PASSWORD \
            --key-pass env:SIGNING_STORE_PASSWORD \
            --out "$SIGNED_APK" \
            "$ALIGNED_APK"
          "$BUILD_TOOLS/apksigner" verify --verbose "$SIGNED_APK"
          rm -f "$KEYSTORE" "$ALIGNED_APK"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: YemenBills-Signed-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
